<style>
.actions-row{display:flex;justify-content:center;gap:12px;margin:18px 0;padding:0 10px}
.ab{width:58px;height:58px;border-radius:50%;border:1px solid #333;background:#222;color:#aaa;font-size:22px;display:flex;align-items:center;justify-content:center}
.ab.x{background:#2a2a2a;color:white;font-size:28px;width:62px;height:62px}
.ab.star{color:#6ecbff}.ab.heart{background:#ff2a4a;color:white;border:none;width:68px;height:68px;font-size:30px}.ab.boost{color:#a68eff}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121212;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0 14px}
.nav{color:#777;text-align:center;font-size:11px}.nav.active{color:white}.nav .ic{font-size:22px;display:block;margin-bottom:3px}
.badge{position:absolute;background:#ff2a4a;color:white;font-size:10px;padding:2px 5px;border-radius:10px;top:-6px;right:18px;font-weight:bold}
.nav{position:relative}
</style>

<div class="actions-row">
  <button class="ab">↺</button>
  <button class="ab x">✕</button>
  <button class="ab star">★</button>
  <button class="ab heart">♥</button>
  <button class="ab boost">⚡</button>
</div>

<div style="height:80px"></div>

<div class="bottom-nav">
  <div class="nav active"><span class="ic">🔥</span>Swipe</div>
  <div class="nav"><span class="ic">◎</span>Explore</div>
  <div class="nav"><span class="ic">♡</span><span class="badge">3</span>Likes</div>
  <div class="nav"><span class="ic">💬</span>Chat</div>
  <div class="nav"><span class="ic">👤</span>Profile</div>
</div>
