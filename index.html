<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOGEA</title><style>body{background:#121212;color:white;font-family:sans-serif;margin:0;height:100vh;overflow:hidden}.stack{width:95%;max-width:380px;height:65vh;margin:20px auto;background:#222;border-radius:20px;position:relative;overflow:hidden}.stack img{width:100%;height:100%;object-fit:cover}.overlay{position:absolute;bottom:0;width:100%;background:linear-gradient(transparent,black);padding:15px}.actions{display:flex;justify-content:center;gap:12px;margin:10px}.b{width:58px;height:58px;border-radius:50%;border:1px solid #333;background:#222;color:white;font-size:24px}.b.heart{background:red;border:none;width:65px;height:65px}.bottom{display:flex;justify-content:space-around;background:#111;padding:12px;position:fixed;bottom:0;width:100%;border-top:1px solid #222}.bottom div{color:#888;font-size:12px;text-align:center}.bottom div.active{color:white}</style></head><body>
<div class="stack" id="st"><img id="img" src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600"><div class="overlay"><h2 id="nm">Neema 23 ✅</h2><p>📍 4km - Mwanza - Active</p></div></div>
<div class="actions"><button class="b" onclick="next()">↺</button><button class="b" onclick="next()">✕</button><button class="b" style="color:#6ecbff" onclick="alert('Super Like!')">★</button><button class="b heart" onclick="like()">♥</button><button class="b" style="color:#a68eff" onclick="alert('Boost! Lipia PLUS')">⚡</button></div>
<div class="bottom"><div class="active">🔥<br>Swipe</div><div>◎<br>Explore</div><div>♡<br>Likes</div><div>💬<br>Chat</div><div>👤<br>Profile</div></div>
<script>
const p=[{i:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600",n:"Neema 23 ✅"},{i:"https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=600",n:"Faith 22 ✅"},{i:"https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=600",n:"Zuwena 26 ✅"}];let k=0;
function next(){k=(k+1)%p.length;document.getElementById('img').src=p[k].i;document.getElementById('nm').innerText=p[k].n}
function like(){alert('❤️ MATCH! Umempenda '+document.getElementById('nm').innerText);next()}
let sx=0;document.getElementById('st').addEventListener('touchstart',e=>sx=e.touches[0].clientX);
document.getElementById('st').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(dx>80)like();if(dx<-80)next()});
</script></body></html>
